<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enroll | Faith for the Cosmos</title>
<link rel="stylesheet" href="css/course.css">
</head>
<body>
<div class="wrap narrow">
  <h1>Enroll in Faith for the Cosmos</h1>
  <p>A Pastor's Guide to Mystery, UAP, and the Questions Your Congregation Is Already Asking. Fill in your details below and we'll send you a secure sign-in link, no password needed.</p>

  <div class="card" id="enroll-card">
    <input type="text" id="full-name" placeholder="Full name" autocomplete="name">
    <input type="text" id="church-name" placeholder="Church / ministry name" autocomplete="organization">
    <input type="text" id="role-title" placeholder="Role / title (e.g. Senior Pastor)">
    <input type="text" id="denomination" placeholder="Denomination / tradition">
    <input type="text" id="years-ministry" placeholder="Years in ministry">
    <input type="text" id="credentials" placeholder="Ordination credentials (e.g. M.Div, license #)">
    <input type="text" id="phone" placeholder="Phone number" autocomplete="tel">
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <button id="enroll-btn" onclick="handleEnroll()">Send me a login link</button>
    <p id="msg"></p>
  </div>

  <p style="text-align: center; font-size: 0.85rem;">Already enrolled? <a href="login.html">Sign in here</a> instead.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
  (async () => {
    const user = await getCurrentUser();
    if (user) window.location.href = "dashboard.html";
  })();

  async function handleEnroll() {
    const fullName = document.getElementById("full-name").value.trim();
    const churchName = document.getElementById("church-name").value.trim();
    const roleTitle = document.getElementById("role-title").value.trim();
    const denomination = document.getElementById("denomination").value.trim();
    const yearsMinistry = document.getElementById("years-ministry").value.trim();
    const credentials = document.getElementById("credentials").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("enroll-btn");

    if (!fullName) {
      msg.textContent = "Please enter your full name.";
      msg.className = "error-msg";
      return;
    }
    if (!email || !email.includes("@")) {
      msg.textContent = "Please enter a valid email address.";
      msg.className = "error-msg";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    const error = await sendMagicLinkWithDetails(email, {
      full_name: fullName,
      church_name: churchName,
      role_title: roleTitle,
      denomination: denomination,
      years_ministry: yearsMinistry,
      credentials: credentials,
      phone: phone,
    });

    if (error) {
      msg.textContent = "Something went wrong: " + error.message;
      msg.className = "error-msg";
      btn.disabled = false;
      btn.textContent = "Send me a login link";
    } else {
      msg.textContent = "Check your email. Click the link we sent to finish enrolling.";
      msg.className = "success-msg";
      btn.textContent = "Link sent";
    }
  }
</script>
</body>
</html>
